<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moja Vercel aplikacija</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🚀 Vercel vaja - CI/CD</h1>

    <p id="opis">
      To je izboljšana verzija aplikacije z več funkcionalnostmi.
    </p>

    <!-- GUMB ZA SPREMEMBO BESEDILA -->
    <button id="btnText">Spremeni besedilo</button>

    <!-- ŠTEVEC -->
    <div class="section">
      <h2>Števec klikov</h2>
      <p id="counter">0</p>
      <button id="btnCounter">Klikni me</button>
    </div>

    <!-- ČAS -->
    <div class="section">
      <h2>Trenutni čas</h2>
      <p id="time"></p>
    </div>

    <!-- DARK MODE -->
    <div class="section">
      <h2>Dark mode</h2>
      <button id="toggleTheme">Preklopi temo</button>
    </div>

    <!-- ALERT -->
    <div class="section">
      <h2>Test gumb</h2>
      <button id="alertBtn">Prikaži sporočilo</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
